<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">How MyOS turns a correction into a rule</title>
<desc id="d">An illustration with made-up content. You correct your assistant once and the correction is saved as a candidate. The second time, the assistant asks whether to make it a rule. After you answer adopt, the instruction files of Claude Code and Codex both get the new rule.</desc>
<style>
  .bg { fill: #0f1419; }
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .step { fill: #8b98a5; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .who { fill: #8b98a5; font-size: 12px; }
  .who2 { fill: #e6edf3; font-size: 15px; font-weight: 600; }
  .msg { fill: #e6edf3; font-size: 15px; }
  .you { fill: #1f3a5f; }
  .ai { fill: #1c2530; }
  .note { fill: #7ee2a8; font-size: 14px; }
  .chip { fill: none; stroke: #4b5a6a; }
  .chip.on { fill: #1f6f4a; stroke: #2ea56f; }
  .chiptext { fill: #e6edf3; font-size: 13px; }
  .file { fill: #151c24; stroke: #2b3743; }
  .path, .code, .codeadd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .path { fill: #8b98a5; }
  .code { fill: #b8c4d0; }
  .added { fill: #143d2b; }
  .codeadd { fill: #7ee2a8; }
  .big { fill: #ffffff; font-size: 30px; font-weight: 700; }
  .big2 { fill: #e6edf3; font-size: 19px; }
  .foot { fill: #5c6b7a; font-size: 11px; }
</style>
<rect class="bg" width="760" height="400" rx="14"/>
<text x="40" y="44" class="step" text-anchor="start" opacity="0">1  You correct it once<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.0083;0.0229;0.2354;0.2500;1.0000"/></text>
<rect x="275.0" y="84" width="445.0" height="42" rx="10" class="you" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.0208;0.0354;0.2354;0.2500;1.0000"/></rect>
<text x="291.0" y="76" class="who" text-anchor="start" opacity="0">You<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.0208;0.0354;0.2354;0.2500;1.0000"/></text>
<text x="291.0" y="110" class="msg" text-anchor="start" opacity="0">For weekend plans, show me the quiet option first.<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.0208;0.0354;0.2354;0.2500;1.0000"/></text>
<rect x="40" y="172" width="331.59999999999997" height="42" rx="10" class="ai" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.0792;0.0938;0.2354;0.2500;1.0000"/></rect>
<text x="56" y="164" class="who" text-anchor="start" opacity="0">Assistant<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.0792;0.0938;0.2354;0.2500;1.0000"/></text>
<text x="56" y="198" class="msg" text-anchor="start" opacity="0">Done: the quiet option is now first.<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.0792;0.0938;0.2354;0.2500;1.0000"/></text>
<text x="40" y="268" class="note" text-anchor="start" opacity="0">Saved as a candidate, with your words. Not a rule yet.  (1 candidate waiting)<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.1250;0.1396;0.2354;0.2500;1.0000"/></text>
<text x="40" y="44" class="step" text-anchor="start" opacity="0">2  The second time, it asks<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.2583;0.2729;0.5271;0.5417;1.0000"/></text>
<rect x="404.6" y="84" width="315.4" height="42" rx="10" class="you" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.2750;0.2896;0.5271;0.5417;1.0000"/></rect>
<text x="420.6" y="76" class="who" text-anchor="start" opacity="0">You<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.2750;0.2896;0.5271;0.5417;1.0000"/></text>
<text x="420.6" y="110" class="msg" text-anchor="start" opacity="0">Again: quiet option first, please.<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.2750;0.2896;0.5271;0.5417;1.0000"/></text>
<rect x="40" y="172" width="355.9" height="64" rx="10" class="ai" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3479;0.5271;0.5417;1.0000"/></rect>
<text x="56" y="164" class="who" text-anchor="start" opacity="0">Assistant<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3479;0.5271;0.5417;1.0000"/></text>
<text x="56" y="198" class="msg" text-anchor="start" opacity="0">You said this on 3 May and again today.<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3479;0.5271;0.5417;1.0000"/></text>
<text x="56" y="220" class="msg" text-anchor="start" opacity="0">Make it a rule for weekend plans?<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.3396;0.3542;0.5271;0.5417;1.0000"/></text>
