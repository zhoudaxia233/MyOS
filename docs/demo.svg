<text x="199.0" y="282" class="chiptext" text-anchor="middle" opacity="0">adopt with edits<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.3833;0.3979;0.5271;0.5417;1.0000"/></text>
