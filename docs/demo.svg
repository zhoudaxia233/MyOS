<text x="56" y="112" class="who2" text-anchor="start" opacity="0">Claude Code<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.5750;0.5896;0.7771;0.7917;1.0000"/></text>
<text x="56" y="134" class="path" text-anchor="start" opacity="0">~/.claude/CLAUDE.md<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.5750;0.5896;0.7771;0.7917;1.0000"/></text>
<text x="56" y="170" class="code" text-anchor="start" opacity="0">## MyOS: my rules<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.5958;0.6104;0.7771;0.7917;1.0000"/></text>
<text x="56" y="194" class="code" text-anchor="start" opacity="0">- Show me drafts before sending<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.5958;0.6104;0.7771;0.7917;1.0000"/></text>
