<text x="56" y="224" class="codeadd" text-anchor="start" opacity="0">+ Quiet option first (principle):<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.6417;0.6562;0.7771;0.7917;1.0000"/></text>
<text x="56" y="244" class="codeadd" text-anchor="start" opacity="0">  weekend plans<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.6417;0.6562;0.7771;0.7917;1.0000"/></text>
