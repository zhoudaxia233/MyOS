<text x="325.0" y="282" class="chiptext" text-anchor="middle" opacity="0">one-off<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.3833;0.3979;0.5271;0.5417;1.0000"/></text>
<rect x="634" y="318" width="86" height="42" rx="10" class="you" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.4500;0.4646;0.5271;0.5417;1.0000"/></rect>
<text x="650" y="310" class="who" text-anchor="start" opacity="0">You<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.4500;0.4646;0.5271;0.5417;1.0000"/></text>
<text x="650" y="344" class="msg" text-anchor="start" opacity="0">adopt<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.4500;0.4646;0.5271;0.5417;1.0000"/></text>
<text x="40" y="44" class="step" text-anchor="start" opacity="0">3  Every assistant gets it<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.5500;0.5646;0.7771;0.7917;1.0000"/></text>
