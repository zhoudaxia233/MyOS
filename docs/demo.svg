<text x="406" y="224" class="codeadd" text-anchor="start" opacity="0">+ Quiet option first (principle):<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.6417;0.6562;0.7771;0.7917;1.0000"/></text>
<text x="406" y="244" class="codeadd" text-anchor="start" opacity="0">  weekend plans<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.6417;0.6562;0.7771;0.7917;1.0000"/></text>
<text x="40" y="312" class="note" text-anchor="start" opacity="0">One write. Both files updated. Your exact words are kept as the source.<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.6833;0.6979;0.7771;0.7917;1.0000"/></text>
<text x="380.0" y="170" class="big" text-anchor="middle" opacity="0">Correct it once.<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.8042;0.8188;0.9729;0.9875;1.0000"/></text>
<text x="380.0" y="214" class="big2" text-anchor="middle" opacity="0">After you approve, every assistant you use follows it.<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.8333;0.8479;0.9729;0.9875;1.0000"/></text>
<text x="380.0" y="262" class="note" text-anchor="middle" opacity="0">Nothing becomes a rule behind your back.<animate attributeName="opacity" dur="24s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.0000;0.8667;0.8813;0.9729;0.9875;1.0000"/></text>
